services:
  # FastAPI Backend Service on Render with Persistent Disk Storage
  - type: web
    name: sichai-pani-backend
    env: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: sichai-pani-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: USE_SQLITE_FALLBACK
        value: "true"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        value: 689098637340-sh3f1per7t6lk73ueopffqcl2ba2he47.apps.googleusercontent.com
      - key: ALLOW_GOOGLE_SIGNIN_DEV
        value: "true"
      - key: WATER_RATE_PER_HOUR
        value: "200.0"

  # React Vite Frontend Service on Render
  - type: web
    name: sichai-pani-frontend
    env: static
    region: singapore
    rootDir: frontend
    buildCommand: npm install && VITE_API_URL=https://sichai-pani-backend.onrender.com npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
