services:
  # FastAPI Backend Service on Render
  - type: web
    name: sichai-pani-backend
    env: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: USE_SQLITE_FALLBACK
        value: "true"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        value: 689098637340-sh3f1per7t6lk73ueopffqcl2ba2he47.apps.googleusercontent.com
      - key: ALLOW_GOOGLE_SIGNIN_DEV
        value: "true"
      - key: WATER_RATE_PER_HOUR
        value: "200.0"

  # React Vite Frontend Service on Render
  - type: web
    name: sichai-pani-frontend
    env: static
    region: singapore
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: sichai-pani-backend
          property: url
